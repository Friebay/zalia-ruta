[project]
name = "zalia-ruta"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Friebay", email = "frybaylt@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "accelerate>=1.15.0",
    "click>=8.0.0",
    "faster-whisper>=1.2.1",
    "numpy>=2.4.6",
    "soundfile>=0.14.0",
    "torch>=2.6.0",
    "torchaudio==2.6.0",
    "tqdm>=4.66.0",
    "transformers>=5.20.2",
]

[project.optional-dependencies]
bench = [
    "datasets>=5.1.0",
    "jiwer>=3.0",
    "onnx-asr>=0.12.0",
]

[tool.uv.sources]
torch = [{ index = "pytorch-cu124" }]
torchaudio = [{ index = "pytorch-cu124" }]

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[project.scripts]
zalia-ruta = "zalia_ruta.cli:main"
zalia-bench = "zalia_ruta.bench.cli:main"

[build-system]
requires = ["uv_build>=0.12.11,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

