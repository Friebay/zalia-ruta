[project]
name = "zalia-ruta"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Friebay", email = "frybaylt@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "accelerate>=1.15.0",
    "click>=8.0.0",
    "numpy>=2.4.6",
    "soundfile>=0.14.0",
    "torch>=2.6.0",
    "transformers>=5.20.2",
]

[project.scripts]
zalia-ruta = "zalia_ruta.cli:main"

[build-system]
requires = ["uv_build>=0.12.11,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
